# Production deployment for Universal Workbench (private self-hosting).
#
# Usage:
#   POSTGRES_PASSWORD=... VAULT_MASTER_KEYS='1:<base64-32B>' \
#     docker compose -f deploy/docker/compose.prod.yml up -d --build
#
# Hardening vs the dev compose (deploy/docker/compose.yml):
# - every service has CPU/memory bounds and a restart policy;
# - all traffic stays on the isolated `workbench` bridge network — only the
#   reverse proxy (Caddy/Nginx, operator-managed, see
#   docs/runbooks/private-deployment.md) publishes ports;
# - images run as non-root already (node / nginx-unprivileged); app/worker
#   additionally get a read-only root filesystem with a tmpfs for /tmp;
# - NO default credentials: POSTGRES_PASSWORD and VAULT_MASTER_KEYS are
#   required from the environment (or a .env file with 0600 permissions).
#   Compose fails fast when they are missing (see the `config-check` step).

name: universal-workbench-prod

networks:
  workbench:
    driver: bridge
    internal: false

volumes:
  postgres-data:
  artifacts-data:

services:
  config-check:
    image: busybox:1.36
    networks: []
    command:
      - sh
      - -c
      - |
        : "$${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
        : "$${VAULT_MASTER_KEYS:?VAULT_MASTER_KEYS is required (format '1:<base64-32B>')}"
        echo "required production secrets present"
    restart: "no"

  postgres:
    image: postgres:17-alpine
    networks:
      - workbench
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-workbench}
    # No published ports: reachable only from the workbench network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    networks:
      - workbench
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://workbench:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-workbench}}
    depends_on:
      config-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command:
      - node
      - --input-type=module
      - -e
      - |
        import { closeDatabasePool, createDatabasePool, migrateDatabase } from "@uw/database";
        const pool = createDatabasePool(process.env.DATABASE_URL);
        try {
          await migrateDatabase(pool);
        } finally {
          await closeDatabasePool(pool);
        }
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: "no"

  app:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    networks:
      - workbench
    environment:
      APP_MODE: all
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://workbench:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-workbench}}
      ARTIFACTS_DIR: /app/data/artifacts
      SESSION_COOKIE_SECURE: "true"
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:?TRUSTED_ORIGINS is required (public https origin)}
      VAULT_MASTER_KEYS: ${VAULT_MASTER_KEYS:?VAULT_MASTER_KEYS is required}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - artifacts-data:/app/data/artifacts
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    networks:
      - workbench
    environment:
      APP_MODE: worker
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://workbench:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-workbench}}
      ARTIFACTS_DIR: /app/data/artifacts
      VAULT_MASTER_KEYS: ${VAULT_MASTER_KEYS:?VAULT_MASTER_KEYS is required}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - artifacts-data:/app/data/artifacts
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    networks:
      - workbench
    # Served only to the reverse proxy; publish 8080 on the host only for
    # first-boot checks, then remove the mapping.
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M
    restart: unless-stopped
