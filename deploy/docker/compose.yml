services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
      POSTGRES_DB: workbench
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment:
      APP_MODE: all
      PORT: 3000
      DATABASE_URL: postgresql://workbench:workbench@postgres:5432/workbench
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - app

volumes:
  postgres-data:
