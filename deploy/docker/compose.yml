services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workbench}
      POSTGRES_DB: ${POSTGRES_DB:-workbench}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://workbench:workbench@postgres:5432/workbench}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - --input-type=module
      - -e
      - |
        import { closeDatabasePool, createDatabasePool, migrateDatabase } from "@uw/database";
        const pool = createDatabasePool(process.env.DATABASE_URL);
        try {
          await migrateDatabase(pool);
        } finally {
          await closeDatabasePool(pool);
        }
    restart: "no"

  app:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment:
      APP_MODE: all
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://workbench:workbench@postgres:5432/workbench}
      ARTIFACTS_DIR: /app/data/artifacts
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      WORKBENCH_DOCKER_SMOKE_FIXTURE: ${WORKBENCH_DOCKER_SMOKE_FIXTURE:-}
      # Test-only vault keyring for throwaway smoke deployments. Never commit
      # real keys here; production sets VAULT_MASTER_KEYS from the deployment
      # secret manager (see docs/runbook/vault.md).
      VAULT_MASTER_KEYS: ${VAULT_MASTER_KEYS:-1:cGhhc2U0LWRvY2tlci1zbW9rZS10ZXN0LWtleXJpbmc=}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - artifacts-data:/app/data/artifacts
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  worker:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment:
      APP_MODE: worker
      DATABASE_URL: ${DATABASE_URL:-postgresql://workbench:workbench@postgres:5432/workbench}
      ARTIFACTS_DIR: /app/data/artifacts
      WORKBENCH_DOCKER_SMOKE_FIXTURE: ${WORKBENCH_DOCKER_SMOKE_FIXTURE:-}
      VAULT_MASTER_KEYS: ${VAULT_MASTER_KEYS:-1:cGhhc2U0LWRvY2tlci1zbW9rZS10ZXN0LWtleXJpbmc=}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - artifacts-data:/app/data/artifacts

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  artifacts-data:
