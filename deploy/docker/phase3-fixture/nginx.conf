events {}

http {
  server {
    listen 80;
    server_name _;

    access_log off;

    location = /json {
      default_type application/json;
      add_header Cache-Control "no-store";
      return 200 '{"body":"Phase 3 HTTP fixture output","source":"docker-smoke"}';
    }

    location / {
      return 404;
    }
  }
}
