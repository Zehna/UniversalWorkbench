name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: workbench
          POSTGRES_DB: workbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbench -d workbench_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - name: Production dependency audit
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            output="$(npm audit --omit=dev --audit-level=high 2>&1)"
            status=$?
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if printf '%s\n' "$output" | grep -Eqi '503 Service Unavailable|502 Bad Gateway|504 Gateway Timeout|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN'; then
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 15))
                continue
              fi
            fi
            exit "$status"
          done
          exit 1
      - run: npm run verify:workspaces
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://workbench:workbench@127.0.0.1:5432/workbench_test
      - run: npm run build
      - run: node scripts/verify-pwa.mjs

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - name: Build and start reference deployment
        run: docker compose -f deploy/docker/compose.yml up -d --build
      - name: Smoke deployment
        env:
          SMOKE_SECRET_CANARY: phase2-smoke-secret-canary-do-not-log
        run: node scripts/smoke-http.mjs
      - name: Capture deployment logs
        if: always()
        run: docker compose -f deploy/docker/compose.yml logs --no-color | tee phase2-docker.log
      - name: Verify deployment logs contain no secrets
        if: always()
        env:
          SMOKE_SECRET_CANARY: phase2-smoke-secret-canary-do-not-log
        run: node scripts/verify-no-secrets.mjs phase2-docker.log
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker/compose.yml down -v

  browser-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: workbench
          POSTGRES_DB: workbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbench -d workbench_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run e2e:sync
        env:
          TEST_DATABASE_URL: postgresql://workbench:workbench@127.0.0.1:5432/workbench_test

  worker-mode:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: workbench
          POSTGRES_DB: workbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbench -d workbench_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npm run verify:worker-mode
        env:
          TEST_DATABASE_URL: postgresql://workbench:workbench@127.0.0.1:5432/workbench_test
