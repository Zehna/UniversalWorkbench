name: Format Phase 2 Task 1 RED files

on:
  push:
    branches:
      - phase-2-local-first-sync

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-local-first-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: >-
          npx prettier --write
          docs/superpowers/plans/2026-09-18-phase-2-local-first-sync.md
          packages/contracts/test/sync-contracts.test.ts
      - name: Commit formatted files
        run: |
          if [ -z "$(git status --porcelain -- docs/superpowers/plans/2026-09-18-phase-2-local-first-sync.md packages/contracts/test/sync-contracts.test.ts)" ]; then
            echo "Nothing to format"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-18-phase-2-local-first-sync.md packages/contracts/test/sync-contracts.test.ts
          git commit -m "style: format phase 2 task 1 red files"
          git push origin HEAD:phase-2-local-first-sync
