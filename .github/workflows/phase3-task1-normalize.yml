name: Diagnose Phase 3 Task 1

on:
  push:
    branches:
      - phase-3-tools-workflow
    paths:
      - .github/workflows/phase3-task1-normalize.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-tools-workflow
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          {
            echo "=== npm install --package-lock-only ==="
            npm install --package-lock-only --ignore-scripts
            echo "npm_install_exit=$?"
            echo
            echo "=== prettier check ==="
            npx prettier --check packages/contracts/src/context.ts packages/contracts/src/tool.ts packages/contracts/src/workflow.ts packages/contracts/src/execution.ts packages/contracts/src/index.ts packages/context packages/tools packages/workflow packages/execution scripts/verify-workspaces.mjs package.json
            echo "prettier_exit=$?"
            echo
            echo "=== git status ==="
            git status --short
          } > phase3-task1-diagnostic.txt 2>&1
          cat phase3-task1-diagnostic.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase3-task1-diagnostic.txt package-lock.json
          git commit -m "chore: capture phase 3 task 1 diagnostics"
          git push origin HEAD:phase-3-tools-workflow
