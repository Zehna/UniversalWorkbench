name: Phase 0 dependency audit

on:
  push:
    branches:
      - phase-0-foundation

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - name: Production audit
        continue-on-error: true
        run: npm audit --omit=dev
      - name: Full audit
        continue-on-error: true
        run: npm audit
