name: Phase 3 Task 4 GREEN Format

on:
  push:
    branches:
      - phase-3-tool-workflow-core

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-tool-workflow-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: >
          npx prettier --write
          packages/contracts/src/document.ts
          packages/documents/src/model.ts
          packages/documents/src/repository.ts
          packages/documents/src/service.ts
          packages/database/src/repositories/documents.ts
          apps/web/src/local/store.ts
          apps/web/src/local/mutations.ts
          apps/web/src/local/indexeddb-store.ts
          apps/web/src/local/sqlite-store.ts
          apps/web/src/local/sqlite-worker.ts
          apps/web/src/sync/coordinator.ts
          apps/web/test/local-mutations.test.ts
          apps/web/test/sync-coordinator.test.ts
          apps/web/test/phase-1-flow.test.tsx
          packages/documents/test/workflow-documents.test.ts
          packages/database/test/workflow-documents.integration.test.ts
          apps/web/test/workflow-local-mutations.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/document.ts packages/documents/src/model.ts packages/documents/src/repository.ts packages/documents/src/service.ts packages/database/src/repositories/documents.ts apps/web/src/local/store.ts apps/web/src/local/mutations.ts apps/web/src/local/indexeddb-store.ts apps/web/src/local/sqlite-store.ts apps/web/src/local/sqlite-worker.ts apps/web/src/sync/coordinator.ts apps/web/test/local-mutations.test.ts apps/web/test/sync-coordinator.test.ts apps/web/test/phase-1-flow.test.tsx packages/documents/test/workflow-documents.test.ts packages/database/test/workflow-documents.integration.test.ts apps/web/test/workflow-local-mutations.test.ts
          git commit -m "style: format phase 3 workflow documents"
          git push origin HEAD:phase-3-tool-workflow-core
