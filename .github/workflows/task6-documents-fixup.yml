name: Task 6 document fixup

on:
  push:
    branches:
      - phase-1-project-data-core

permissions:
  contents: write

jobs:
  fixup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-project-data-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install --ignore-scripts
      - name: Format Task 6 files
        run: >-
          npx prettier --write
          package-lock.json
          packages/documents/package.json
          packages/documents/src/model.ts
          packages/documents/src/repository.ts
          packages/documents/src/service.ts
          packages/documents/src/index.ts
          packages/database/package.json
          packages/database/src/index.ts
          packages/database/src/repositories/documents.ts
          packages/database/test/documents.integration.test.ts
      - name: Commit fixup
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No fixup needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json packages/documents packages/database
          git commit -m "chore: normalize task 6 document implementation"
          git push origin HEAD:phase-1-project-data-core
