name: Format Phase 1 RED

on:
  push:
    branches:
      - phase-1-project-data-core

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-project-data-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npx prettier --write docs/superpowers/plans/2026-09-15-phase-1-project-data-core.md packages/contracts/test/phase-1-contracts.test.ts
      - name: Commit format-only changes
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-15-phase-1-project-data-core.md packages/contracts/test/phase-1-contracts.test.ts
          git commit -m "style: format phase 1 plan and red contract test"
          git push origin HEAD:phase-1-project-data-core
