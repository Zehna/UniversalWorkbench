name: Normalize Phase 2 Task 2 GREEN

on:
  push:
    branches:
      - phase-2-local-first-sync

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-local-first-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install --ignore-scripts
      - name: Generate Drizzle migration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          npx drizzle-kit generate --config=packages/database/drizzle.config.ts --name=phase2_sync
          test -f packages/database/drizzle/0001_phase2_sync.sql
      - run: >-
          npx prettier --write
          packages/database/src/schema.ts
          packages/database/src/repositories/sync.ts
          packages/database/src/index.ts
          packages/database/package.json
      - name: Commit generated files
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json packages/database)" ]; then
            echo "Nothing to normalize"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json packages/database
          git commit -m "chore: generate phase 2 sync migration"
          git push origin HEAD:phase-2-local-first-sync
