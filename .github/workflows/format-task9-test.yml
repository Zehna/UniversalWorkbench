name: Format Task 9 test

on:
  push:
    branches:
      - phase-1-project-data-core

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-project-data-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npx prettier --write apps/web/test/phase-1-flow.test.tsx
      - name: Commit formatted test
        run: |
          if [ -z "$(git status --porcelain -- apps/web/test/phase-1-flow.test.tsx)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/test/phase-1-flow.test.tsx
          git commit -m "style: normalize phase 1 pwa flow test"
          git push origin HEAD:phase-1-project-data-core
