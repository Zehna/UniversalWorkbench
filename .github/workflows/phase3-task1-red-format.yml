name: Phase 3 Task 1 RED Format

on:
  push:
    branches:
      - phase-3-tool-workflow-core

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-tool-workflow-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npx prettier --write docs/superpowers/plans/2026-09-19-phase-3-tool-workflow-core.md docs/superpowers/specs/2026-09-19-phase-3-tool-workflow-core-design.md packages/contracts/test/phase-3-contracts.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-19-phase-3-tool-workflow-core.md docs/superpowers/specs/2026-09-19-phase-3-tool-workflow-core-design.md packages/contracts/test/phase-3-contracts.test.ts
          git commit -m "style: format phase 3 task 1 red inputs"
          git push origin HEAD:phase-3-tool-workflow-core
