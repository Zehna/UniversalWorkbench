name: Normalize Phase 2 Task 4 GREEN

on:
  push:
    branches:
      - phase-2-local-first-sync

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-local-first-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: >-
          npx prettier --write
          apps/web/src/local/indexeddb-store.ts
          apps/web/src/local/mutations.ts
          apps/web/src/local/open-local-store.ts
          apps/web/src/local/store.ts
      - name: Commit normalized Task 4 source
        run: |
          if [ -z "$(git status --porcelain -- apps/web/src/local)" ]; then
            echo "Nothing to normalize"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/local
          git commit -m "style: normalize phase 2 task 4"
          git push origin HEAD:phase-2-local-first-sync
