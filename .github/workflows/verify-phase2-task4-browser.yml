name: Verify Phase 2 Task 4 Browser Fallback

on:
  push:
    branches:
      - phase-2-local-first-sync

permissions:
  contents: write

jobs:
  indexeddb-fallback:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-local-first-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test apps/web/e2e/local-indexeddb.spec.ts --project=chromium
      - name: Remove one-shot browser verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-phase2-task4-browser.yml
          git commit -m "chore: remove phase 2 task 4 browser verifier"
          git push origin HEAD:phase-2-local-first-sync
