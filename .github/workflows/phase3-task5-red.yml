name: Phase 3 Task 5 RED

on:
  push:
    branches:
      - phase-3-tool-workflow-core

jobs:
  red:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: workbench
          POSTGRES_DB: workbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbench -d workbench_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-tool-workflow-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - name: Execution model RED
        run: npm run test -w @uw/execution -- model.test.ts
      - name: Migration RED
        if: always()
        env:
          TEST_DATABASE_URL: postgresql://workbench:workbench@127.0.0.1:5432/workbench_test
        run: npm run test -w @uw/database -- phase-3-migration.integration.test.ts
