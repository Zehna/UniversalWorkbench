name: Task 9 GREEN

on:
  push:
    branches:
      - phase-1-project-data-core

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npm run typecheck -w @uw/web
      - run: npm run test -w @uw/web
      - run: npm run build -w @uw/web
