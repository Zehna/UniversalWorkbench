name: Phase 2 Task 6 GREEN

on:
  push:
    branches:
      - phase-2-local-first-sync

permissions:
  contents: write

jobs:
  green:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-local-first-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install --package-lock-only --ignore-scripts
      - run: >-
          npx prettier --write
          packages/sync/src/repository.ts
          packages/sync/src/conflict.ts
          packages/sync/src/apply.ts
          packages/sync/src/index.ts
          packages/sync/test/apply.test.ts
          packages/sync/package.json
          package.json
      - run: npm ci
      - run: npm run test -w @uw/sync -- apply.test.ts
      - name: Commit normalized GREEN state
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json package.json packages/sync)" ]; then
            echo "Nothing to normalize"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json packages/sync
          git commit -m "chore: normalize phase 2 task 6 apply core"
          git push origin HEAD:phase-2-local-first-sync
