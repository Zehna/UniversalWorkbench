name: Generate Phase 1 migration

on:
  push:
    branches:
      - phase-1-project-data-core

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-project-data-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - name: Generate migration from schema
        env:
          DATABASE_URL: postgresql://workbench:workbench@127.0.0.1:5432/workbench
        run: npx drizzle-kit generate --config=packages/database/drizzle.config.ts --name=phase1
      - name: Commit generated migration
        run: |
          if git diff --quiet -- packages/database/drizzle; then
            echo "No migration changes generated"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/drizzle
          git commit -m "chore: generate phase 1 database migration"
          git push origin HEAD:phase-1-project-data-core
