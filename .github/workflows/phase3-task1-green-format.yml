name: Phase 3 Task 1 GREEN Format

on:
  push:
    branches:
      - phase-3-tool-workflow-core

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-tool-workflow-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npx prettier --write packages/contracts/src/context.ts packages/contracts/src/execution.ts packages/contracts/src/tool.ts packages/contracts/src/workflow.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/context.ts packages/contracts/src/execution.ts packages/contracts/src/tool.ts packages/contracts/src/workflow.ts
          git commit -m "style: format phase 3 execution contracts"
          git push origin HEAD:phase-3-tool-workflow-core
