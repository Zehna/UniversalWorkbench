name: Normalize Task 9

on:
  push:
    branches:
      - phase-1-project-data-core

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-project-data-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: >-
          npx prettier --write
          apps/web/src/App.tsx
          apps/web/src/api/client.ts
          apps/web/src/auth/AuthGate.tsx
          apps/web/src/auth/SetupOwner.tsx
          apps/web/src/auth/Login.tsx
          apps/web/src/projects/ProjectList.tsx
          apps/web/src/projects/ProjectWorkspace.tsx
          apps/web/src/documents/NoteEditor.tsx
          apps/web/test/App.test.tsx
          apps/web/test/phase-1-flow.test.tsx
      - name: Commit normalized frontend
        run: |
          if [ -z "$(git status --porcelain -- apps/web)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web
          git commit -m "style: normalize phase 1 pwa implementation"
          git push origin HEAD:phase-1-project-data-core
