name: Normalize Phase 2 Task 3 GREEN

on:
  push:
    branches:
      - phase-2-local-first-sync

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-local-first-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install --package-lock-only --ignore-scripts
      - run: >-
          npx prettier --write
          package.json
          apps/web/package.json
          playwright.config.ts
          apps/web/e2e/local-opfs.spec.ts
          apps/web/src/local/store.ts
          apps/web/src/local/schema.ts
          apps/web/src/local/sqlite-worker.ts
          apps/web/src/local/sqlite-store.ts
          apps/web/src/local/open-local-store.ts
          apps/web/vite.config.ts
          apps/web/nginx.conf
          apps/web/src/main.tsx
      - name: Commit normalized files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to normalize"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json apps/web playwright.config.ts
          git commit -m "chore: normalize phase 2 task 3"
          git push origin HEAD:phase-2-local-first-sync
