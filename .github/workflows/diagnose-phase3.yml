name: Diagnose Phase 3 quality

on:
  push:
    branches:
      - phase-3-tool-workflow-core

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: workbench
          POSTGRES_DB: workbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbench -d workbench_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-tool-workflow-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: mkdir -p .phase3-diag

      - id: install
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm ci 2>&1 | tee .phase3-diag/install.log

      - id: audit
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm audit --omit=dev --audit-level=high 2>&1 | tee .phase3-diag/audit.log

      - id: workspaces
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run verify:workspaces 2>&1 | tee .phase3-diag/workspaces.log

      - id: format
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run format:check 2>&1 | tee .phase3-diag/format.log

      - id: lint
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run lint 2>&1 | tee .phase3-diag/lint.log

      - id: typecheck
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run typecheck 2>&1 | tee .phase3-diag/typecheck.log

      - id: tests
        continue-on-error: true
        env:
          TEST_DATABASE_URL: postgresql://workbench:workbench@127.0.0.1:5432/workbench_test
        shell: bash
        run: set -o pipefail; npm test 2>&1 | tee .phase3-diag/tests.log

      - id: build
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee .phase3-diag/build.log

      - id: pwa
        continue-on-error: true
        shell: bash
        run: set -o pipefail; node scripts/verify-pwa.mjs 2>&1 | tee .phase3-diag/pwa.log

      - name: Commit diagnostic report
        if: always()
        shell: bash
        run: |
          {
            echo "install=${{ steps.install.outcome }}"
            echo "audit=${{ steps.audit.outcome }}"
            echo "workspaces=${{ steps.workspaces.outcome }}"
            echo "format=${{ steps.format.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "typecheck=${{ steps.typecheck.outcome }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "pwa=${{ steps.pwa.outcome }}"
            echo
            for file in .phase3-diag/*.log; do
              echo "===== $file ====="
              tail -n 120 "$file"
              echo
            done
          } > phase3-ci-diagnostic.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase3-ci-diagnostic.txt
          git commit -m "chore: capture phase 3 quality diagnostic"
          git push origin HEAD:phase-3-tool-workflow-core
