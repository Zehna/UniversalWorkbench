name: Format Phase 2 Task 4 GREEN

on:
  push:
    branches:
      - phase-2-local-first-sync

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-local-first-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npx prettier --write apps/web/src/local/mutations.ts
      - name: Commit formatted source and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-phase2-task4-green.yml
          git add apps/web/src/local/mutations.ts
          git commit -m "chore: format phase 2 task 4 mutation source"
          git push origin HEAD:phase-2-local-first-sync
