name: Task 7 artifact fixup

on:
  push:
    branches:
      - phase-1-project-data-core

permissions:
  contents: write

jobs:
  fixup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-project-data-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install --package-lock-only --ignore-scripts
      - name: Format Task 7 files
        run: >-
          npx prettier --write
          package-lock.json
          packages/storage/package.json
          packages/storage/src/backend.ts
          packages/storage/src/local-filesystem.ts
          packages/storage/src/index.ts
          packages/storage/test/local-filesystem.test.ts
          packages/artifacts/package.json
          packages/artifacts/src/model.ts
          packages/artifacts/src/repository.ts
          packages/artifacts/src/service.ts
          packages/artifacts/src/index.ts
          packages/database/package.json
          packages/database/src/index.ts
          packages/database/src/repositories/artifacts.ts
          packages/database/test/artifacts.integration.test.ts
      - name: Commit fixup
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No fixup needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json packages/storage packages/artifacts packages/database
          git commit -m "chore: normalize task 7 artifact implementation"
          git push origin HEAD:phase-1-project-data-core
