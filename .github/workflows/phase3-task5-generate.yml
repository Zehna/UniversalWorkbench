name: Phase 3 Task 5 Generate Migration

on:
  push:
    branches:
      - phase-3-tool-workflow-core

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: workbench
          POSTGRES_DB: workbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbench -d workbench_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-tool-workflow-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - name: Generate migration
        env:
          DATABASE_URL: postgresql://workbench:workbench@127.0.0.1:5432/workbench_test
        run: npx drizzle-kit generate --config=packages/database/drizzle.config.ts --name=phase3_execution
      - name: Format Task 5 sources
        run: npx prettier --write packages/database/src/schema.ts packages/execution/src packages/execution/test/model.test.ts packages/database/test/phase-3-migration.integration.test.ts
      - name: Verify execution model
        run: npm run test -w @uw/execution -- model.test.ts
      - name: Verify Phase 3 migration
        env:
          TEST_DATABASE_URL: postgresql://workbench:workbench@127.0.0.1:5432/workbench_test
        run: npm run test -w @uw/database -- phase-3-migration.integration.test.ts
      - name: Commit generated migration and formatting
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/database/drizzle packages/database/src/schema.ts packages/execution/src packages/execution/test/model.test.ts packages/database/test/phase-3-migration.integration.test.ts
            git commit -m "feat: add phase 3 execution migration"
            git push origin HEAD:phase-3-tool-workflow-core
          else
            echo "No changes to commit"
          fi
