name: Format Phase 1 auth integration test

on:
  push:
    branches:
      - phase-1-project-data-core

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-project-data-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npx prettier --write apps/server/test/auth.integration.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet -- apps/server/test/auth.integration.test.ts; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/test/auth.integration.test.ts
          git commit -m "style: format owner auth integration test"
          git push origin HEAD:phase-1-project-data-core
