name: Refresh Phase 1 lockfile

on:
  push:
    branches:
      - phase-1-project-data-core

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-project-data-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for phase 1 workspaces"
          git push origin HEAD:phase-1-project-data-core
